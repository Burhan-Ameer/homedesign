{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="px-6 py-8 min-h-[calc(100vh-64px)] bg-white">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-playfair font-bold text-wood-dark">Saved Designs</h1>
            <a href="{% url 'canvas' %}" class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">
                <i class="fas fa-plus mr-2"></i> New Design
            </a>
        </div>

        <!-- Saved designs grid -->
        <div id="saved-designs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading placeholder -->
            <div id="loading-placeholder" class="col-span-full flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-gray-900"></div>
            </div>
        </div>

        <!-- No saved designs message -->
        <div id="no-designs-message" class="hidden bg-white p-10 text-center rounded-xl shadow-md">
            <i class="fas fa-drafting-compass text-5xl text-gray-400 mb-4"></i>
            <h3 class="text-xl font-medium text-gray-800 mb-2">No Saved Designs Yet</h3>
            <p class="text-gray-600 mb-6">You haven't saved any canvas designs yet.</p>
            <a href="{% url 'canvas' %}" class="inline-block px-6 py-3 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">
                Create Your First Design
            </a>
        </div>
    </div>

    <!-- Design View Modal -->
    <div id="design-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <!-- Modal header -->
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-xl font-bold text-gray-900" id="modal-title">Design Preview</h3>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Modal body -->
            <div class="p-4 flex-grow overflow-auto">
                <div class="relative w-full" style="padding-bottom: 60%;">
                    <div id="design-container" class="absolute inset-0 bg-gray-100 rounded-lg"></div>
                </div>
                <div class="mt-4 flex justify-between items-center text-sm text-gray-600">
                    <div id="design-info">
                        <span id="design-timestamp"></span>
                        <span id="design-item-count" class="ml-4"></span>
                    </div>
                </div>
            </div>
            
            <!-- Modal footer -->
            <div class="border-t p-4 flex justify-between">
                <button id="delete-design-btn" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center">
                    <i class="fas fa-trash-alt mr-2"></i> Delete
                </button>
                <div class="flex gap-2">
                    <button id="edit-design-btn" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 flex items-center">
                        <i class="fas fa-edit mr-2"></i> Edit
                    </button>
                    <button id="download-design-btn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 flex items-center">
                        <i class="fas fa-download mr-2"></i> Download
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{% static 'js/saved_designs.js' %}"></script>
{% endblock %}
